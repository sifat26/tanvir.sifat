<!doctype html>
<html>
  <head><meta charset="utf-8" /></head>
  <body>
    <pre id="out">PENDING</pre>
    <script>
      const params = new URLSearchParams(location.search);
      const target = Number(params.get('w') || 640);
      const quality = Number(params.get('q') || 0.82);
      const type = params.get('type') || 'image/webp';
      const square = params.get('square') === '1';

      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        const x = c.getContext('2d');
        if (square) {
          c.width = target;
          c.height = target;
          const side = Math.min(img.width, img.height);
          // center-crop to a square, biased slightly toward the top for portraits
          const sx = (img.width - side) / 2;
          const sy = Math.max(0, (img.height - side) / 2 - img.height * 0.06);
          x.drawImage(img, sx, sy, side, side, 0, 0, target, target);
        } else {
          const ratio = 10 / 16;
          c.width = target;
          c.height = Math.round(target * ratio);
          const cropH = Math.min(img.height, img.width * ratio);
          const sy = Math.max(0, (img.height - cropH) / 2 - img.height * 0.1);
          x.drawImage(img, 0, sy, img.width, cropH, 0, 0, c.width, c.height);
        }
        document.getElementById('out').textContent = c.toDataURL(type, quality);
      };
      img.onerror = () => {
        document.getElementById('out').textContent = 'ERROR';
      };
      img.src = params.get('src');
    </script>
  </body>
</html>
