# Nginx Configuration for Sifat Portfolio
# Copy this to /etc/nginx/sites-available/portfolio on your VPS
# Then: sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

# HTTP server block - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tanvir-sifat.duckdns.org www.tanvir-sifat.duckdns.org;
    
    # Let Certbot verify the domain
    location ~ /.well-known/acme-challenge/ {
        root /var/www/portfolio;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tanvir-sifat.duckdns.org www.tanvir-sifat.duckdns.org;

    # SSL certificates (added by Certbot)
    ssl_certificate /etc/letsencrypt/live/tanvir-sifat.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tanvir-sifat.duckdns.org/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Root directory
    root /var/www/portfolio/dist;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Cache static assets for 30 days
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache HTML files for 1 hour
    location ~* \.(html)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # SPA routing - serve index.html for all non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Access and error logs
    access_log /var/log/nginx/portfolio_access.log;
    error_log /var/log/nginx/portfolio_error.log;

    # Security: Limit request size
    client_max_body_size 10m;

    # Security: Rate limiting (optional, uncomment if needed)
    # limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;
    # limit_req zone=one burst=20 nodelay;
}

